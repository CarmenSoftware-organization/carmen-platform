name: Verify

# Verifies unit tests + lint + types + production build for non-main branches and PRs.
# Uses only repo contents (checkout) and pinned actions — does not consume
# any untrusted user input from PR titles/bodies/comments.

on:
  pull_request:
    branches: [main, DEV, UAT]
  push:
    # `vercel` คือกิ่ง deploy ของ Vercel — ทุก commit ที่ไปถึงมันผ่าน CI มาแล้วตอนเป็น PR
    # (main เป็น base เดียวและ push ตรงเข้ากิ่งนี้เป็น fast-forward จาก main เท่านั้น)
    branches-ignore: [main, DEV, UAT, vercel]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs before the build: the suite finishes in well under a minute, so a
      # behavioural regression reports faster than waiting on ESLint + tsc + Vite.
      # Vitest transpiles without type-checking, so this does not overlap with the
      # build's tsc pass — the two catch different failures.
      - name: Unit & component tests (Vitest)
        env:
          CI: 'true'
        run: bun run test

      - name: Build (ESLint + TypeScript + Vite)
        env:
          CI: 'true'
          REACT_APP_API_BASE_URL: https://placeholder.invalid
          REACT_APP_API_APP_ID: ci-placeholder
        run: bun run build

  # Mirrors how Vercel builds (npm + .npmrc legacy-peer-deps=true). bun and npm
  # hoist node_modules differently, so a peer dependency that is only present in
  # the bun tree by accident builds fine above and still fails on Vercel — that
  # is exactly how recharts' `react-is` peer slipped through twice. `npm ci` also
  # refuses to run when package-lock.json has drifted from package.json, which
  # keeps the second lockfile honest.
  verify-npm:
    name: verify (npm clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (fails on package-lock.json drift)
        run: npm ci

      - name: Build (ESLint + TypeScript + Vite)
        env:
          CI: 'true'
          REACT_APP_API_BASE_URL: https://placeholder.invalid
          REACT_APP_API_APP_ID: ci-placeholder
        run: npm run build
