# ช่องทางสำรองฉุกเฉินเท่านั้น (EMERGENCY FALLBACK ONLY)
# การ deploy หลักใช้ Cloud Build: .cloudbuild/build.yaml + deploy.yaml (trigger อ่านจาก branch `prod`, deploy ต้อง Approve)
# workflow นี้ใช้เฉพาะเมื่อ Cloud Build ใช้ไม่ได้ (เช่น free credit หมดแต่ GitHub Actions ยังเหลือ) — เข้า GCP ผ่าน
# Workload Identity Federation (carmen-infra-gcp/iam.tf) ก่อนใช้ให้เทียบขั้นตอนกับ .cloudbuild/deploy.yaml ให้ตรงกัน และอ่าน
# carmen-infra-gcp/docs/known-issues.md หัวข้อ "ช่องทางสำรอง: GitHub Actions + WIF"
# Primary deploy path is Cloud Build (.cloudbuild/*.yaml). This workflow is an emergency fallback only — verify it against
# .cloudbuild/deploy.yaml before relying on it.

name: Deploy to GCP (Cloud Storage + CDN)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  CDN_URL_MAP: ${{ vars.CDN_URL_MAP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # .env.prod is gitignored (bakes REACT_APP_* into the build at compile time,
      # there is no runtime config.json like carmen-web) — written here from repo variables
      # instead of being committed. `build:prod` runs `vite build --mode prod`, which loads
      # .env.prod (NOT .env.production). Set these under Settings > Secrets and variables >
      # Actions > Variables in this repo before the first real deploy.
      - name: Write .env.prod
        run: |
          cat > .env.prod <<EOF
          REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL }}
          REACT_APP_API_APP_ID=${{ vars.REACT_APP_API_APP_ID }}
          REACT_APP_ENV=production
          REACT_APP_OTEL_ENABLED=${{ vars.REACT_APP_OTEL_ENABLED || 'true' }}
          REACT_APP_OTEL_ENVIRONMENT=${{ vars.REACT_APP_OTEL_ENVIRONMENT || 'prod' }}
          EOF

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCS + invalidate CDN
        run: |
          chmod +x scripts/deploy-gcs.sh
          scripts/deploy-gcs.sh "${GCS_BUCKET}" "${CDN_URL_MAP}"
